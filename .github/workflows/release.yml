name: Release loom CLI

# Runs when a version tag is pushed in the PUBLIC loom-cli repo (this file is
# inert inside the private monorepo — GitHub only reads .github at a repo root).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel is built on an Apple-Silicon runner: setup-python's macOS
          # build is universal2, so we run the x86_64 slice via `arch -x86_64`
          # (Rosetta) to freeze a genuine x86_64 binary — GitHub's Intel
          # `macos-13` runner is being retired.
          - { runner: macos-14,      os: darwin, arch: arm64,  py_arch: arm64, arch_prefix: "" }
          - { runner: macos-14,      os: darwin, arch: x86_64, py_arch: x64,   arch_prefix: "arch -x86_64" }
          - { runner: ubuntu-latest, os: linux,  arch: x86_64, py_arch: x64,   arch_prefix: "" }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, py_arch: arm64, arch_prefix: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}
      - name: Build self-contained binary
        env:
          ARCH: ${{ matrix.arch_prefix }}
        run: |
          # $ARCH is `arch -x86_64` for the macOS Intel build, empty otherwise —
          # it forces PyInstaller to freeze for the intended CPU slice.
          $ARCH python -m pip install --upgrade pip
          $ARCH python -m pip install .
          $ARCH python -m pip install pyinstaller
          $ARCH python -m PyInstaller --onefile --name loom --paths . \
            --collect-all rich --collect-submodules loom_cli \
            --collect-submodules websockets \
            --collect-data certifi \
            pyinstaller_entry.py
          mv dist/loom "dist/loom-${{ matrix.os }}-${{ matrix.arch }}"
      - name: Smoke test (+ verify macOS arch)
        run: |
          BIN="dist/loom-${{ matrix.os }}-${{ matrix.arch }}"
          "./$BIN" --version
          if [ "${{ matrix.os }}" = "darwin" ]; then
            file "$BIN"
            lipo -archs "$BIN"
            lipo -archs "$BIN" | grep -qw "${{ matrix.arch }}" \
              || { echo "arch mismatch: expected ${{ matrix.arch }}"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/loom-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum loom-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/loom-* artifacts/SHA256SUMS

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # Opt-in: set repo variable PUBLISH_NPM=true and add the NPM_TOKEN secret
    # (a publish token for the @embed-ai org) to enable.
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @embed-ai/loom
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          npm publish --access public

  bump-brew:
    needs: release
    runs-on: ubuntu-latest
    # Opt-in: set repo variable PUBLISH_BREW=true and add the HOMEBREW_TAP_TOKEN
    # secret (a PAT with contents:write on ZKAI-Network/homebrew-loom) to enable.
    if: ${{ vars.PUBLISH_BREW == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Render + push formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAP_REPO: ZKAI-Network/homebrew-loom
        run: |
          VER="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # Pull the published checksums and pick out each arch.
          curl -fsSL "${BASE}/SHA256SUMS" -o SHA256SUMS
          sha() { grep " loom-$1\$" SHA256SUMS | awk '{print $1}'; }
          sed \
            -e "s/__VERSION__/${VER}/g" \
            -e "s/__SHA_DARWIN_ARM64__/$(sha darwin-arm64)/g" \
            -e "s/__SHA_DARWIN_X86_64__/$(sha darwin-x86_64)/g" \
            -e "s/__SHA_LINUX_ARM64__/$(sha linux-arm64)/g" \
            -e "s/__SHA_LINUX_X86_64__/$(sha linux-x86_64)/g" \
            homebrew/loom.rb.tmpl > loom.rb
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp loom.rb tap/Formula/loom.rb
          cd tap
          git config user.name "loom-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/loom.rb
          git commit -m "loom ${VER}" || { echo "no change"; exit 0; }
          git push
